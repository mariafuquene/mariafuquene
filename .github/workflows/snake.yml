name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs (navy & gold)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C9A227&color_dots=#EEF0F4,#C8CEDA,#8D97AD,#4E5A78,#1F2A44
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#C9A227&color_dots=#2A3245,#4E5A78,#8D97AD,#C8CEDA,#FFFFFF

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
