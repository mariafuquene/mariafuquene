name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate golden snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FFD700&color_dots=#E6E6E6,#F1DD99,#E3C35A,#D4AF37,#8A6E1A
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFD700&color_dots=#1A1A1A,#5C4A12,#8A6E1A,#D4AF37,#FFD700

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
